# Pre-commit hooks for Streamline Desktop
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: 'node_modules/'
      - id: end-of-file-fixer
        exclude: '(node_modules/|src-tauri/target/)'
      - id: trailing-whitespace
        exclude: '(\.md$|node_modules/|src-tauri/target/)'
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (Tauri)
        entry: bash -c 'cd src-tauri && cargo fmt --all --'
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (Tauri)
        entry: bash -c 'cd src-tauri && cargo clippy --all-targets -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false

